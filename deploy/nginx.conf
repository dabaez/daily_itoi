# /etc/nginx/sites-available/todays-darling  (symlink into sites-enabled)
#
# Cloudflare sits in front and terminates TLS. Set its SSL mode to "Full (strict)" with
# a Cloudflare Origin Certificate installed below. Otherwise drop the 443 block and use
# "Flexible" (not recommended).

server {
    listen 80;
    listen [::]:80;
    server_name darling.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name darling.example.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    root /srv/todays-darling/web;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The only file that changes daily. Short TTL at the edge and in browsers; the build
    # job also purges it from Cloudflare right after writing it.
    location = /today.json {
        add_header Cache-Control "public, max-age=60, s-maxage=300, stale-if-error=86400" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Art and fonts: filenames are stable, so cache hard.
    location ~* ^/(rooms|npcs|party|fonts)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Page, JS and CSS: cached, but short enough that a deploy shows up within the hour.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    # Leftover temp files from an interrupted atomic write.
    location ~ /\. { deny all; }
}
